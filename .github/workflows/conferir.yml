# ---------------------------------------------------------------------------
# CONFERIR EM TODO PUSH E EM TODO PULL REQUEST
#
# Três trabalhos, em paralelo. Nenhum publica nada nem usa segredo.
#   • conferir: falha conhecida nas dependências de produção, lint, teste de
#     fumaça das rotas, testes, contagem de testes do README e build;
#   • banco: sobe o banco de um Supabase local dentro do runner, aplica a
#     migration e roda os testes de banco (`npm run db:testar`), a mesma prova
#     que quem desenvolve roda na própria máquina;
#   • segredos: o gitleaks, numa versão presa e com a soma conferida, varre o
#     histórico inteiro do repositório (todos os commits de todos os branches,
#     e não só o último) e reprova com qualquer achado.
#
# POR QUE SEM SEGREDOS
# Conferir não precisa falar com o Supabase hospedado nem com a hospedagem. Os
# testes do `conferir` rodam contra um Supabase simulado, sem rede, e o build
# passa sem as variáveis `VITE_*`: o Vite só as grava no bundle, e quem reclama
# da falta delas é o `src/lib/supabase.ts`, na hora de ABRIR o app, não na de
# compilar. Por isso o `dist/` que sai daqui não serve para publicar, e não é
# guardado. O `banco` sobe um Supabase descartável no próprio runner, com as
# credenciais locais padrão do CLI, que não abrem nada fora dele (e que o
# passo não imprime). O `segredos` baixa o gitleaks do release público dele,
# sem login. Sem segredo, o workflow roda igual em pull request vindo de fork,
# que o GitHub não deixa ler segredo nenhum.
#
# O QUE NÃO PASSA POR AQUI
# O `tsc -b` do build confere os tipos de `src/` (e, por ela, dos módulos puros
# da Edge Function que os testes importam) e de `e2e/`, sem rodar os testes de
# ponta a ponta. O lint lê as Edge Functions com o bloco do Deno do
# `eslint.config.js`. A Edge Function em si não roda aqui: o `banco` sobe só o
# banco, e os testes dele falam SQL direto com ele. A função, o app no Chrome e
# as provas de ponta a ponta rodam na automação "Prints da documentação"
# (`prints.yml`), que só roda quando alguém pede.
# ---------------------------------------------------------------------------
name: Conferir

on:
  push:
    # `'**'` casa com qualquer nome de branch, inclusive com barra. Tag não
    # entra: tag não é trabalho novo.
    branches: ['**']
  pull_request:

# Dois pushes seguidos no mesmo branch: o segundo cancela o primeiro, porque só
# o resultado do commit mais novo interessa. Push e pull request do mesmo
# branch têm `ref` diferente e não se cancelam.
concurrency:
  group: conferir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conferir:
    runs-on: ubuntu-latest
    # A conferência inteira leva poucos minutos. Um passo travado não pode
    # segurar o runner pelas 6 horas do limite padrão.
    timeout-minutes: 15

    # Só leitura: este workflow não escreve nada no repositório.
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          # A versão 22 mais nova, que atende ao `engines` do package.json
          # (22.12 ou mais: o jsdom dos testes não roda em Node mais antigo).
          node-version: 22
          # Reaproveita o cache do npm entre execuções, usando o
          # package-lock.json como chave.
          cache: npm

      - name: Instalar as dependências
        # `npm ci` e não `npm install`: instala exatamente o que está no
        # package-lock.json e falha se ele estiver fora de sincronia com o
        # package.json.
        run: npm ci

      - name: Conferir as dependências que vão para o ar
        # Reprova com falha conhecida alta ou crítica numa dependência de
        # produção (as de `dependencies`, que entram no JavaScript que o celular
        # baixa). As ferramentas de build e de teste (`devDependencies`) ficam de
        # fora: não vão para o ar. O passo consulta a base pública de falhas do
        # npm e não usa segredo.
        run: npm audit --omit=dev --audit-level=high

      - name: Conferir o estilo
        run: npm run lint

      - name: Teste de fumaça das rotas
        # O app inteiro monta num DOM simulado (jsdom), com o Supabase
        # simulado, e cada rota de administração e de colaborador é aberta até
        # os efeitos assentarem. Reprova com qualquer erro ou aviso de console,
        # frase de falha de carga, gravação ou RPC desconhecida. Também roda
        # dentro do `npm test`; o passo próprio é para a falha aparecer com
        # nome no resumo. Ver o cabeçalho de `src/fumaca-das-rotas.test.ts`.
        run: npm run test:fumaca

      - name: Rodar os testes
        run: npm test

      - name: Conferir a contagem de testes do README
        # O README diz quantos testes o `npm test` roda, e esse número
        # envelhece calado a cada teste novo. O script pergunta ao Vitest e
        # falha dizendo a linha certa. Ver o cabeçalho de
        # `scripts/conferir-readme.mjs`.
        run: node scripts/conferir-readme.mjs

      - name: Construir o site
        # Sem `env`, de propósito: ver "POR QUE SEM SEGREDOS" no topo.
        run: npm run build

  banco:
    # Os testes de banco (supabase/testes/), num Supabase local que nasce e
    # morre com o runner. Ver o cabeçalho de `scripts/testar-banco.sh`.
    runs-on: ubuntu-latest
    # Baixar as imagens e subir o banco leva poucos minutos, e os testes,
    # segundos. Logo depois da meia-noite de Brasília o script espera até
    # cinco minutos (o pedido de batida esquecida só vale para hoje). Um passo
    # travado não pode segurar o runner pelas 6 horas do limite padrão.
    timeout-minutes: 20

    # Só leitura: este trabalho não escreve nada no repositório.
    permissions:
      contents: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          # A mesma do trabalho `conferir`: o `engines` pede 22.12 ou mais.
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        # O Supabase CLI vem daqui (a devDependency `supabase`): a mesma
        # versão da máquina de quem desenvolve, presa no package-lock.json.
        run: npm ci

      - name: Subir o banco do Supabase local
        # Só o banco: os testes falam SQL direto com ele, e nenhum outro
        # serviço é usado. A estrutura do login (auth) e do storage nasce igual
        # sem os serviços, porque o CLI aplica as migrations deles ao iniciar o
        # banco ("Initialising schema"); depois vem a migration do ponto. Os
        # nomes são os de `npx supabase start --help` do CLI 2.122 (o servidor
        # de e-mail se chama mailpit; um nome que o CLI não conhece é ignorado
        # calado). A saída padrão traz só a URL do banco, com a senha local do
        # CLI, e vai para /dev/null; o progresso e os erros saem no log.
        run: >-
          npx supabase start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          > /dev/null

      - name: Rodar os testes de banco
        # Cada arquivo roda numa transação desfeita no fim; o script exige
        # linhas OK, nenhum FALHOU, o ROLLBACK no fim de cada arquivo e o banco
        # igual antes e depois de todos.
        run: npm run db:testar

  segredos:
    # Uma chave, um token ou uma senha esquecidos em QUALQUER commit, e não só
    # no último: o repositório é público, e um commit velho continua baixável
    # depois de o arquivo sair do topo. O gitleaks lê o histórico inteiro.
    runs-on: ubuntu-latest
    # Baixar o histórico e varrer levam segundos. Um passo travado não pode
    # segurar o runner pelas 6 horas do limite padrão.
    timeout-minutes: 10

    # Só leitura: este trabalho não escreve nada no repositório.
    permissions:
      contents: read

    steps:
      - name: Baixar o código, com o histórico inteiro
        uses: actions/checkout@v4
        with:
          # 0 = todos os commits de todos os branches e tags, e não só o
          # último (o padrão do checkout). É o que o gitleaks varre.
          fetch-depth: 0

      - name: Baixar o gitleaks, com a soma conferida
        # A versão fica presa aqui: um release novo do gitleaks só entra com
        # alguém trocando as duas linhas do `env`. A soma SHA-256 é a do
        # arquivo de checksums do próprio release
        # (gitleaks_8.30.1_checksums.txt); se o pacote baixado não bater com
        # ela, o passo para antes de abrir o pacote. A mesma versão e a mesma
        # soma estão em `prints.yml`: troque as duas juntas.
        env:
          VERSAO: 8.30.1
          SOMA: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          pacote="gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$pacote" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${pacote}"
          echo "${SOMA}  $RUNNER_TEMP/$pacote" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$pacote" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Procurar segredos no histórico inteiro
        # `gitleaks git` sem `--log-opts` lê `git log --all --full-history`:
        # todos os commits que o checkout trouxe. Cada achado sai com o
        # arquivo, o commit e a regra, e o valor tapado (`--redact`); qualquer
        # achado sai com 1 e reprova o trabalho. Uma exceção, se um dia houver
        # falso positivo, vai num `.gitleaks.toml` na raiz (o gitleaks o lê
        # sozinho), a mais estreita possível e com o porquê escrito.
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --exit-code 1 .'
